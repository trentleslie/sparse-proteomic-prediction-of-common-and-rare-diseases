stages:
  - sync

variables:
  GITLAB_USER_EMAIL: trent.leslie@phenomehealth.org
  GITHUB_USER_EMAIL: your_github_email@example.com
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

sync_gitlab_to_github:
  stage: sync
  image: python:3.10
  tags:
    - docker
  before_script:
    - apt-get update && apt-get install -y openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    - git config --global user.email "$GITHUB_USER_EMAIL"
    - git config --global user.name "Trent Leslie"
    - git remote remove github || true
    - git remote add github git@github.com:trentleslie/sparse-proteomic-prediction-of-common-and-rare-diseases.git
  script:
    - python --version
    - git fetch origin || exit 1
    - git checkout main || exit 1
    - git merge origin/main || exit 1
    - echo "Pulling changes from GitHub to avoid conflicts..."
    - git pull github main || exit 1  # Ensure local is up-to-date
    - echo "Attempting to push to GitHub:"
    - git push github main || exit 1
  only:
    - main
